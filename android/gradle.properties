android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false


# ── BATAS MEMORI GRADLE ─────────────────────────────────────────────
#
# PC ini RAM-nya 3,8 GB, tetapi R8 (mesin minify + obfuscate) butuh
# ruang jauh lebih besar daripada build biasa. Ketika heap-nya cuma
# 1200 MB, build GAGAL dengan:
#
#     ERROR: R8: java.lang.OutOfMemoryError: Java heap space
#     Execution failed for task ':app:minifyReleaseWithR8'
#
# Karena itu jatah dinaikkan ke 3072 MB + metaspace 768 MB (total
# sekitar 3,8 GB) — cukup untuk obfuscate, dan tetap dijaga agar
# tidak melebihi RAM mesin.
#
# CATATAN PENTING: hanya boleh ada SATU baris org.gradle.jvmargs.
# Kalau ada dua, Gradle memakai yang PERTAMA dan mengabaikan sisanya.
org.gradle.jvmargs=-Xmx3072M -XX:MaxMetaspaceSize=768M -XX:+UseSerialGC

kotlin.daemon.jvmargs=-Xmx1024m

# Tanpa daemon: tumpukan memori dilepas begitu build selesai.
org.gradle.daemon=false

# Satu pekerja saja supaya tidak ada beberapa tumpukan sekaligus.
org.gradle.workers.max=1
org.gradle.parallel=false
